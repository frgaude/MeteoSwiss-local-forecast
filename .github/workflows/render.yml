# Render the e-paper screens and publish them on GitHub Pages every 20 min.
# MeteoSwiss publishes each hourly run 2–7 min past the hour; the T5 fetches
# at :40. GitHub delays or drops scheduled jobs under load (only 1 of ~10
# hourly runs started on 23 Oct 2026), so run three times an hour, away from
# the busy top of the hour: :12 and :32 both carry the new run to the T5.
name: Render screens

on:
  schedule:
    - cron: "12,32,52 * * * *"
  workflow_dispatch:
    inputs:
      slf_active_at:
        description: "Test only: show the SLF bulletin valid at this UTC time (e.g. 2026-10-25T16:00:00Z)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["render.py", "notebooks/*.py", "requirements.txt", ".github/workflows/render.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache pictograms
        uses: actions/cache@v6
        with:
          path: data/local_forecast/icons
          key: icons-v1
      - run: python render.py site
        env:
          SLF_ACTIVE_AT: ${{ inputs.slf_active_at }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
