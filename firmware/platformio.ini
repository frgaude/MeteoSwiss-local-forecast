; LilyGO T5 4.7" e-paper V2.3 (ESP32-S3-WROOM-1 N16R8): downloads the
; forecast screens published on GitHub Pages and cycles them with the button.
; Settings follow LilyGo-EPD47's own platformio.ini (branch esp32s3).
;
;   pio run -t upload && pio device monitor

[platformio]
boards_dir = boards
default_envs = t5-s3

[env:t5-s3]
platform = espressif32@6.12.0
framework = arduino
board = T5-ePaper-S3          ; 16 MB flash, OPI PSRAM, default_16MB.csv (3.4 MB spiffs)
upload_speed = 921600
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLILYGO_T5_EPD47_S3
	-DCORE_DEBUG_LEVEL=0
	-DLIGHT_CLEAR_CYCLES=1    ; screen clear on button switches (hourly update: 4)
lib_deps =
	https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#50224221fb81a8fcf9068532374b775af84a38d4
